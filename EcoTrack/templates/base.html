<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EcoTrack | {% block title %}Home{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000'/%3E%3Cpath d='M9 21c0-7 5-12 14-12 0 8-4 13-11 13-1 0-2-.3-3-1z' fill='%237ee8a8'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}" aria-label="EcoTrack home">
            <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#121214" stroke="#2a2a2f"/><path d="M9 21c0-7 5-12 14-12 0 8-4 13-11 13-1 0-2-.3-3-1z" fill="#7ee8a8"/><path d="M9 23c3-4 6-7 10-9" stroke="#03140b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
            EcoTrack
        </a>
        {% block tagline %}{% endblock %}
        <nav class="nav" aria-label="Main">
            <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
            <a href="{{ url_for('lifestyle') }}" {% if request.endpoint in ('lifestyle', 'results') %}aria-current="page"{% endif %}>Calculator</a>
        </nav>
    </header>

    {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
